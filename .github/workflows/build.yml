name: Build SlimeTinker

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "2.0.6"
  OUTPUT_NAME: "SF_SlimeTinker2.0.6.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_SlimeTinker${VERSION}.jar"
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = "$VERSION"
          grep -Fq '<finalName>SF_SlimeTinker${project.version}</finalName>' pom.xml
          if printf '%s\n%s\n' "$VERSION" "$OUTPUT_NAME" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Stage canonical raw JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILT_JAR="target/${OUTPUT_NAME}"
          test -s "$BUILT_JAR"
          cp "$BUILT_JAR" "dist/${OUTPUT_NAME}"
          PLUGIN_VERSION=$(unzip -p "dist/${OUTPUT_NAME}" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish canonical raw JAR to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r OLD; do
              if [[ "$OLD" == *.jar && "$OLD" != "$OUTPUT_NAME" ]]; then gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y; fi
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes "SlimeTinker ${VERSION}: canonical ${OUTPUT_NAME} release." --title "SF_SlimeTinker ${VERSION}"
          fi
          echo "### Canonical raw JAR published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: $OUTPUT_NAME" >> "$GITHUB_STEP_SUMMARY"
