name: Build SlimeTinker2

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Confirm Java version
        run: java -version

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Stage SF_SlimeTinkerIE2.jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" dist/SF_SlimeTinkerIE2.jar
          test -s dist/SF_SlimeTinkerIE2.jar
          sha256sum dist/SF_SlimeTinkerIE2.jar

      - name: Upload SF_SlimeTinkerIE2.jar
        uses: actions/upload-artifact@v4
        with:
          name: SF_SlimeTinkerIE2
          path: dist/SF_SlimeTinkerIE2.jar
          if-no-files-found: error

      - name: Publish direct JAR release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          JAR="dist/SF_SlimeTinkerIE2.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "SlimeTinkerIE2 $TAG"
          fi
