name: Build SlimeTinkerIE2

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "2.0.6"
  OUTPUT_NAME: "SF_SlimeTinkerIE22.0.6.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Confirm Java version
        run: java -version

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Stage raw versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILT_JAR="target/${OUTPUT_NAME}"
          test -s "$BUILT_JAR"
          cp "$BUILT_JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Publish RAW JAR to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${LEGACY_ARTIFACT_VERSION}"
          fi

          JAR="dist/${OUTPUT_NAME}"
          test -f "$JAR"
          test "${JAR##*.}" = "jar"

          NOTES="SlimeTinkerIE2 ${LEGACY_ARTIFACT_VERSION} adds Paper 26.3 compatibility validation while keeping Paper 26.2 as the production baseline and preserving the Java 21 universal addon target. The release JAR now follows the standard Slimefun Legacy addon filename format with no extra dash before the version."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --notes "$NOTES" \
              --title "SlimeTinker Legacy ${LEGACY_ARTIFACT_VERSION}"
          fi

          echo "### RAW JAR published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: $OUTPUT_NAME" >> "$GITHUB_STEP_SUMMARY"
