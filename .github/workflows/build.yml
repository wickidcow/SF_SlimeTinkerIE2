name: Build SlimeTinkerIE2

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.0"
  OUTPUT_NAME: "SF_SlimeTinkerIE21.0.0.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Confirm Java version
        run: java -version

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          OUTPUT="dist/${OUTPUT_NAME}"
          cp "${jars[0]}" "$OUTPUT"
          test -s "$OUTPUT"
          sha256sum "$OUTPUT"

      - name: Publish raw JAR release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${LEGACY_ARTIFACT_VERSION}"
          fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --generate-notes --title "SF_SlimeTinkerIE2 $TAG"
          fi
