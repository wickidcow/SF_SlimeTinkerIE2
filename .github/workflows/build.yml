name: Build SlimeTinkerIE2

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "2.0.5"
  OUTPUT_NAME: "SF_SlimeTinkerIE2-2.0.5.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Confirm Java version
        run: java -version

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Stage raw versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          OUTPUT="dist/${OUTPUT_NAME}"
          cp "${jars[0]}" "$OUTPUT"
          test -s "$OUTPUT"
          sha256sum "$OUTPUT"

      # GitHub Actions artifacts are ZIP-wrapped by GitHub. We intentionally do
      # not use actions/upload-artifact here. The canonical downloadable build is
      # uploaded directly as a raw .jar GitHub Release asset below.
      - name: Publish RAW JAR to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${LEGACY_ARTIFACT_VERSION}"
          fi

          JAR="dist/${OUTPUT_NAME}"
          test -f "$JAR"
          test "${JAR##*.}" = "jar"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "SlimeTinker Legacy ${LEGACY_ARTIFACT_VERSION}"
          fi

          echo "### RAW JAR published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: $OUTPUT_NAME" >> "$GITHUB_STEP_SUMMARY"
