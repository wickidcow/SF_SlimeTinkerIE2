name: Build SlimeTinker

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slimetinker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: '2.0.7'
  OUTPUT_NAME: SF_SlimeTinker2.0.7.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Install verified compile-only release APIs
        run: bash scripts/install_release_apis.sh
      - name: Verify source version and run all tests across supported APIs
        shell: bash
        run: |
          set -euo pipefail
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = "$VERSION"
          mkdir -p evidence dist
          SF_ARGS=(-Dslimefun.groupId=com.github.wickidcow -Dslimefun.artifactId=Slimefun-Legacy -Dslimefun.version=4.1.63)
          # Rebuild the distributable LAST against the oldest supported API.
          for API in 26.2.build.123-stable 26.3-rc-3.build.1-alpha 1.21.11-R0.1-SNAPSHOT; do
            mvn -B -ntp clean verify "${SF_ARGS[@]}" -Dpaper.version="$API" -Dmaven.compiler.release=21 2>&1 | tee "evidence/build-$API.log"
            mkdir -p "evidence/tests-$API"
            cp target/surefire-reports/TEST-*.xml "evidence/tests-$API/"
          done
          cp "target/$OUTPUT_NAME" "dist/$OUTPUT_NAME"
          python3 scripts/verify_release.py "dist/$OUTPUT_NAME" "$VERSION"
          sha256sum "dist/$OUTPUT_NAME" > evidence/SHA256SUMS
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - name: Retain complete test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slimetinker-test-evidence
          path: evidence/
          if-no-files-found: error
      - name: Upload drop-in JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
